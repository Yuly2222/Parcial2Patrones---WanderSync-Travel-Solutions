# nginx sirve el frontend ya compilado y actúa como PROXY INVERSO hacia el API Gateway.
#
# ¿Por qué un proxy y no llamar directo a http://localhost:8000?
#   - El navegador ve UN SOLO ORIGEN (localhost:3000) para la página y para /graphql.
#     Así la cookie de sesión (HttpOnly, SameSite=Strict) funciona sin abrir CORS en el Gateway.
#   - El frontend sigue sin conocer ningún microservicio: solo existe /graphql.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;              # no revelar la versión de nginx en errores ni cabeceras

    # IP REAL del visitante cuando llega por la URL pública (Cloudflare Tunnel): el túnel entrega la petición
    # desde la red interna de Docker y pone la IP original en CF-Connecting-IP. Solo se le cree a esa cabecera
    # si la petición viene de una IP privada (la del contenedor del túnel); sin cabecera, se usa la conexión.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 64k;       # una operación GraphQL nunca debería pesar más (frena abusos)

    # ---------- API: todo lo de /graphql va al Gateway ----------
    location /graphql {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real del cliente: el Gateway la usa para el rate limiting.
        # Sin esto, todas las peticiones parecerían venir de nginx y compartirían un mismo límite.
        # El Gateway SOLO confía en esta cabecera cuando la petición viene de este contenedor.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # "https" cuando la petición llegó por la URL pública: el Gateway marca entonces la cookie como Secure
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;     # una SAGA con compensaciones reintentadas puede tardar
    }

    # ---------- Aplicación React (SPA) ----------
    location / {
        try_files $uri /index.html;

        # Cabeceras de seguridad (defensa en profundidad contra XSS, clickjacking y sniffing).
        # La CSP solo permite recursos del propio origen: scripts, estilos, fuentes y fetch a /graphql.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Archivos con hash en el nombre (los genera Vite): se pueden cachear "para siempre"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
