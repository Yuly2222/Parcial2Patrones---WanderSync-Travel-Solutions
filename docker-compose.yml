services:
  # Servidor PostgreSQL. Dentro tiene UNA base de datos por microservicio (ver db/init.sql).
  db:
    image: postgres:16                 # Imagen oficial; versión fija para que todo el equipo tenga la misma
    environment:
      POSTGRES_PASSWORD: dev           # Contraseña SOLO para desarrollo local
    volumes:
      # Monta nuestro script dentro de la carpeta que Postgres ejecuta al crear la BD
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:                       # Docker pregunta cada 3s si Postgres ya acepta conexiones
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s

  # Microservicio de Vuelos
  vuelos:
    build: ./vuelos                    # Construye la imagen con el Dockerfile de la carpeta vuelos/
    environment:
      # "db" es el NOMBRE del servicio de arriba: dentro de Compose los servicios se encuentran por nombre.
      # (localhost aquí sería el propio contenedor de vuelos, no la BD). El final "/vuelos" = su propia base de datos.
      DATABASE_URL: postgresql://postgres:dev@db:5432/vuelos
    depends_on:
      db: { condition: service_healthy }  # No arranca hasta que el healthcheck de db diga "listo"
    # Sin "ports:" a propósito: solo accesible por otros contenedores, no desde afuera.

  # Microservicio de Hoteles
  hoteles:
    build: ./hoteles
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/hoteles
    depends_on:
      db: { condition: service_healthy }

  # Microservicio de Autos
  autos:
    build: ./autos
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/autos
      # Interruptor de la demo de fallo. Toma el valor de la variable FORZAR_FALLO_AUTOS
      # de la terminal (o de un archivo .env); si no existe, vale "false".
      FORZAR_FALLO_AUTOS: ${FORZAR_FALLO_AUTOS:-false}
    depends_on:
      db: { condition: service_healthy }

  # Microservicio de Órdenes = orquestador de la SAGA
  ordenes:
    build: ./ordenes
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/ordenes
    depends_on:
      db: { condition: service_healthy }
      vuelos: { condition: service_started }
      hoteles: { condition: service_started }
      autos: { condition: service_started }

  # API Gateway GraphQL: ÚNICO servicio con puerto expuesto hacia afuera.
  # El frontend solo habla con él. GraphiQL: http://localhost:8000/graphql
  gateway:
    build: ./gateway
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/auth   # usuarios y sesiones
      COOKIE_SECURE: "false"           # "true" en producción con HTTPS
      # El rate limiting solo cree la cabecera X-Real-IP si viene de este servicio (ver seguridad.py)
      PROXY_CONFIABLE: frontend
    depends_on:
      db: { condition: service_healthy }
      vuelos: { condition: service_started }
      hoteles: { condition: service_started }
      autos: { condition: service_started }
      ordenes: { condition: service_started }
    ports:
      - "8000:8000"                    # "puerto_de_tu_PC:puerto_del_contenedor"

  # Frontend React (compilado) servido por nginx. nginx reenvía /graphql al Gateway:
  # el navegador ve un solo origen y el frontend nunca habla con otro microservicio.
  # Interfaz: http://localhost:3000
  frontend:
    build: ./frontend
    depends_on:
      gateway: { condition: service_started }
    ports:
      - "3000:80"

  # ===================== INGESTA: Prefect + Dask + scraper =====================
  # Los 4 servicios usan la misma imagen (carpeta ingesta/) con distinto "command".

  # Servidor de Prefect: guarda el historial de flows/tareas y sirve el panel web
  prefect-server:
    build: ./ingesta
    command: prefect server start --host 0.0.0.0
    environment:
      # URL que usa el NAVEGADOR (desde tu PC) para hablar con la API de Prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
      # Historial de Prefect en PostgreSQL (BD "prefect"), no en su SQLite por defecto: con 2 workers de Dask
      # escribiendo a la vez, SQLite responde "database is locked" y se pierden task runs y logs del panel.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:dev@db:5432/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"   # sin telemetría hacia Prefect
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      retries: 20
    ports:
      - "4200:4200"                    # Panel de Prefect: http://localhost:4200

  # Scheduler de Dask: recibe las tareas y las reparte entre los workers
  dask-scheduler:
    build: ./ingesta
    command: dask scheduler
    ports:
      - "8787:8787"                    # Panel de Dask: http://localhost:8787

  # Workers de Dask: ejecutan las tareas (descargar, estructurar, limpiar, guardar)
  dask-worker:
    build: ./ingesta
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2
    deploy:
      replicas: 2                      # 2 contenedores worker -> computación distribuida real
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/hoteles   # la tarea "guardar" corre aquí
      PREFECT_API_URL: http://prefect-server:4200/api           # las tareas reportan su estado a Prefect
      PROB_FALLO_SCRAPER: ${PROB_FALLO_SCRAPER:-0}              # demo de retries (ver README)
    depends_on:
      dask-scheduler: { condition: service_started }
      db: { condition: service_healthy }

  # El flow: se registra en Prefect, se programa cada 30 min y envía sus tareas al clúster de Dask
  ingesta:
    build: ./ingesta
    command: python flow.py
    volumes:
      # Muestras de Trivago guardadas desde el navegador: agregar una no exige reconstruir la imagen
      - ./ingesta/muestras:/app/muestras
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/hoteles
      PREFECT_API_URL: http://prefect-server:4200/api
      DASK_SCHEDULER: tcp://dask-scheduler:8786
    depends_on:
      prefect-server: { condition: service_healthy }   # sin servidor de Prefect el flow no puede registrarse
      dask-worker: { condition: service_started }
